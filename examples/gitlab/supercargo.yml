# Job templates the emitted child pipeline extends. Supercargo decides WHAT to
# build; these define HOW. Lives at .gitlab/supercargo.yml in your repo (the
# child pipeline includes it; override with `emit gitlab-ci --template-include`).

.supercargo-build:
  image: docker:27
  services: [docker:27-dind]
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - |
      tag_flags=""
      for ref in $SUPERCARGO_TAGS; do tag_flags="$tag_flags -t $ref"; done
      # shellcheck disable=SC2086
      docker build $tag_flags $SUPERCARGO_BUILD_ARGS \
        -f "$SUPERCARGO_DOCKERFILE" "$SUPERCARGO_CONTEXT"
    - for ref in $SUPERCARGO_TAGS; do docker push "$ref"; done

# Hash-mode skips: copy the new tags onto the existing image, registry-side.
.supercargo-retag:
  image:
    name: gcr.io/go-containerregistry/crane:debug
    entrypoint: [""]
  script:
    - crane auth login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - |
      for ref in $SUPERCARGO_TAGS; do
        [ "$ref" = "$SUPERCARGO_EXISTING" ] && continue
        crane tag "$SUPERCARGO_EXISTING" "${ref##*:}"
      done
