# Example GitHub Actions workflow: plan with supercargo, build only what changed,
# retag what the registry already has. Copy into .github/workflows/ and adjust
# the registry login.
name: Images

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.supercargo.outputs.matrix }}
      has_work: ${{ steps.supercargo.outputs.has_work }}
      skipped: ${{ steps.supercargo.outputs.skipped }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Diff mode resolves a merge-base; hash mode reads HEAD only, but the
          # cheap default is full history so both work.
          fetch-depth: 0
      # Hash mode reads the credentials docker/login-action writes to
      # ~/.docker/config.json; no extra tool is needed for probing.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: rolandjitsu/supercargo@v0.1.0
        id: supercargo
        with:
          version: 0.1.0

  build:
    name: Build ${{ matrix.name }}
    needs: plan
    if: needs.plan.outputs.has_work == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ matrix.tags_csv }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  # Hash-mode skips still want the new git-sha tag on the existing image:
  # copy tags registry-side, no pull.
  retag:
    name: Retag unchanged images
    needs: plan
    if: github.event_name != 'pull_request' && needs.plan.outputs.skipped != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: imjasonh/setup-crane@v0.4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Retag
        run: |
          echo '${{ needs.plan.outputs.skipped }}' | jq -c '.[]' | while read -r entry; do
            existing="$(echo "$entry" | jq -r '.existing')"
            echo "$entry" | jq -r '.tags[]' | while read -r tag; do
              [ "$tag" = "$existing" ] && continue
              crane tag "$existing" "${tag##*:}"
            done
          done
